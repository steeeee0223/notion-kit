name: CI

on:
  pull_request:
    branches: ["*", "feat/*"]
  push:
    branches: ["main", "feat/*"]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# You can leverage Vercel Remote Caching with Turbo to speed up your builds
# @link https://turborepo.org/docs/core-concepts/remote-caching#remote-caching-on-vercel-builds
env:
  FORCE_COLOR: 3
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./tooling/github/setup
        with:
          base: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before || github.event.pull_request.base.sha || github.event.merge_group.base_sha || 'origin/main' }}
          head: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}

      - name: Copy env
        shell: bash
        run: cp .env.example .env

      - name: Build
        run: pnpm build:packages

      - name: Lint
        run: pnpm lint:ws && pnpm lint:affected

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./tooling/github/setup
        with:
          base: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before || github.event.pull_request.base.sha || github.event.merge_group.base_sha || 'origin/main' }}
          head: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}

      - name: Format
        run: pnpm format:affected

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./tooling/github/setup
        with:
          base: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before || github.event.pull_request.base.sha || github.event.merge_group.base_sha || 'origin/main' }}
          head: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}

      - name: Build
        run: pnpm build:packages

      - name: Typecheck
        run: pnpm typecheck:affected

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        uses: ./tooling/github/setup

      - name: Build
        run: pnpm build:packages

      - name: Test table-hook package entry
        run: pnpm -F @notion-kit/table-hook test:package-exports

      - name: Test
        run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./tooling/github/setup
        with:
          base: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before || github.event.pull_request.base.sha || github.event.merge_group.base_sha || 'origin/main' }}
          head: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}

      - name: Check whether E2E is affected
        id: affected
        shell: bash
        run: |
          if pnpm exec turbo query affected \
            --packages @notion-kit/e2e \
            --base "$TURBO_SCM_BASE" \
            --head "$TURBO_SCM_HEAD" \
            --exit-code; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [[ "$status" -ne 1 ]]; then
              exit "$status"
            fi

            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Chromium
        if: steps.affected.outputs.run == 'true'
        run: pnpm --filter @notion-kit/e2e exec playwright install --with-deps chromium

      - name: E2E test
        if: steps.affected.outputs.run == 'true'
        run: pnpm --filter @notion-kit/e2e test:e2e
